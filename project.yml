name: Hozz

options:
  bundleIdPrefix: com.thatcube
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.46.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_EMIT_LOC_STRINGS: true

targetTemplates:
  HozzFramework:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        SKIP_INSTALL: true
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

  HozzMacFramework:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        SKIP_INSTALL: true
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

targets:
  HozzCore:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzCore

  HozzAcquire:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzAcquire
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzAcquire

  HozzCatalog:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzCatalog
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzCatalog

  HozzStore:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzStore
    dependencies:
      - target: HozzCore
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzStore

  HozzUI:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzUI

  HozzDeliver:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzDeliver
    dependencies:
      - target: HozzCore
      - target: HozzStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzDeliver

  HozzReceive:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzReceive
    dependencies:
      - target: HozzCore
      - target: HozzStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzReceive

  HozzMCP:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzMCP
    dependencies:
      - target: HozzCore
      - target: HozzStore
      - target: HozzReceive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzMCP

  HozzHealth:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzHealth
    dependencies:
      - target: HozzCore
      - target: HozzAcquire
      - target: HozzCatalog
      - target: HozzStore
      - target: HozzDeliver
      - sdk: HealthKit.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzHealth

  HozzHealthFake:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzHealthFake
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzHealthFake

  Hozz:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    dependencies:
      - target: HozzCore
      - target: HozzAcquire
      - target: HozzCatalog
      - target: HozzStore
      - target: HozzDeliver
      - target: HozzHealth
      - target: HozzUI
      - target: HozzWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Hozz
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: App/Hozz.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
        # The App Groups entitlement is deliberately not declared here.
        #
        # The widget is a separate process with its own container, so it can
        # only read live sync state through a shared group container. But
        # declaring an entitlement the provisioning profile lacks fails *every*
        # device build, so it cannot be committed until the capability is
        # registered with Apple.
        #
        # `tools/device-build.sh` resolves this without anyone editing this
        # file: it checks the downloaded profiles for the group and injects the
        # entitlement only when it is actually available. Register the
        # capability once and device builds start including it automatically.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hozz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Hozz reads the Health data you select so you can export it to destinations you own.
        # Required before Hozz may look for a receiver on the local network.
        NSLocalNetworkUsageDescription: Hozz looks for the Hozz app on your computer so you can send Health data to it without typing an address.
        NSBonjourServices:
          - _hozz._tcp
        BGTaskSchedulerPermittedIdentifiers:
          - com.thatcube.Hozz.processing
          - com.thatcube.Hozz.refresh
        UIBackgroundModes:
          - processing
          - fetch
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  HozzWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
    dependencies:
      - target: HozzCore
      - target: HozzStore
      - target: HozzDeliver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Hozz.widget
        # The widget reads the same store the app writes, which requires the
        # shared container both sides already use. The matching entitlement is
        # injected by tools/device-build.sh when the capability exists; see the
        # note on the app target above.
        SKIP_INSTALL: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hozz
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  HozzTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: HozzCore
      - target: HozzAcquire
      - target: HozzCatalog
      - target: HozzStore
      - target: HozzDeliver
      - target: HozzHealth
      - target: HozzHealthFake
      - target: HozzReceive
      - target: HozzMCP
      - target: Hozz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzTests
        GENERATE_INFOPLIST_FILE: true
        # Keychain access needs an application identity, so the tests run
        # inside the app rather than as a standalone bundle.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hozz.app/Hozz"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # macOS builds of the cross-platform modules. Only HozzHealth is iOS-only,
  # because HealthKit has no data to read on a Mac.
  HozzCoreMac:
    templates:
      - HozzMacFramework
    sources:
      - Sources/HozzCore
    settings:
      base:
        PRODUCT_NAME: HozzCore
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.mac.HozzCore

  HozzStoreMac:
    templates:
      - HozzMacFramework
    sources:
      - Sources/HozzStore
    dependencies:
      - target: HozzCoreMac
    settings:
      base:
        PRODUCT_NAME: HozzStore
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.mac.HozzStore

  HozzDeliverMac:
    templates:
      - HozzMacFramework
    sources:
      - Sources/HozzDeliver
    dependencies:
      - target: HozzCoreMac
      - target: HozzStoreMac
    settings:
      base:
        PRODUCT_NAME: HozzDeliver
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.mac.HozzDeliver

  HozzReceiveMac:
    templates:
      - HozzMacFramework
    sources:
      - Sources/HozzReceive
    dependencies:
      - target: HozzCoreMac
      - target: HozzStoreMac
    settings:
      base:
        PRODUCT_NAME: HozzReceive
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.mac.HozzReceive

  HozzMCPMac:
    templates:
      - HozzMacFramework
    sources:
      - Sources/HozzMCP
    dependencies:
      - target: HozzCoreMac
      - target: HozzStoreMac
      - target: HozzReceiveMac
    settings:
      base:
        PRODUCT_NAME: HozzMCP
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.mac.HozzMCP

  hozz-mcp:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - MCPTool
    dependencies:
      - target: HozzCoreMac
        embed: false
      - target: HozzStoreMac
        embed: false
      - target: HozzReceiveMac
        embed: false
      - target: HozzMCPMac
        embed: false
    settings:
      base:
        PRODUCT_NAME: hozz-mcp
        SKIP_INSTALL: true
        # The tool lives inside the app bundle, so it looks for its frameworks
        # there rather than beside itself.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"

  HozzMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Mac
    dependencies:
      - target: HozzCoreMac
      - target: HozzStoreMac
      - target: HozzDeliverMac
      - target: HozzReceiveMac
      - target: HozzMCPMac
      - target: hozz-mcp
        embed: false
    settings:
      base:
        PRODUCT_NAME: Hozz
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Hozz.mac
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    # The MCP tool ships inside the bundle so the assistant configuration can
    # point at one stable path that moves with the app. Inputs and outputs are
    # declared because user script sandboxing is on.
    postBuildScripts:
      - name: Embed the MCP tool
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/hozz-mcp
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/hozz-mcp
        script: |
          set -eu
          destination="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS"
          mkdir -p "${destination}"
          # Signing is left to Xcode's own phase, which runs after this and
          # seals the bundle including anything copied in here.
          cp -f "${BUILT_PRODUCTS_DIR}/hozz-mcp" "${destination}/hozz-mcp"
    entitlements:
      path: Mac/HozzMac.entitlements
      properties:
        # Sandboxed, with exactly two holes: listen for the phone, and let the
        # user pick where an export goes. No outgoing network access at all.
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Hozz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Free and open source."
        # Required before a sandboxed app may advertise or browse Bonjour.
        NSBonjourServices:
          - _hozz._tcp
        NSLocalNetworkUsageDescription: Hozz receives Health data your iPhone sends directly to this Mac over your own network.

schemes:
  HozzMac:
    build:
      targets:
        HozzMac: all
    run:
      config: Debug
    archive:
      config: Release

  Hozz:
    build:
      targets:
        Hozz: all
        HozzTests:
          - test
    test:
      targets:
        - HozzTests
