name: Hozz

options:
  bundleIdPrefix: com.thatcube
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.46.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_EMIT_LOC_STRINGS: true

targetTemplates:
  HozzFramework:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        SKIP_INSTALL: true
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

targets:
  HozzCore:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzCore

  HozzAcquire:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzAcquire
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzAcquire

  HozzCatalog:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzCatalog
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzCatalog

  HozzHealth:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzHealth
    dependencies:
      - target: HozzCore
      - target: HozzCatalog
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzHealth

  HozzHealthFake:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzHealthFake
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzHealthFake

  Hozz:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    dependencies:
      - target: HozzCore
      - target: HozzCatalog
      - target: HozzHealth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Hozz
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: App/Hozz.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hozz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Hozz reads the Health data you select so you can export it to destinations you own.
        BGTaskSchedulerPermittedIdentifiers:
          - com.thatcube.Hozz.processing
        UIBackgroundModes:
          - processing
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  HozzTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: HozzCore
      - target: HozzAcquire
      - target: HozzCatalog
      - target: HozzHealth
      - target: HozzHealthFake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Hozz:
    build:
      targets:
        Hozz: all
        HozzTests:
          - test
    test:
      targets:
        - HozzTests
