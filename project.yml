name: Hozz

options:
  bundleIdPrefix: com.thatcube
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.46.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_EMIT_LOC_STRINGS: true

targetTemplates:
  HozzFramework:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        SKIP_INSTALL: true
        DEFINES_MODULE: true
        GENERATE_INFOPLIST_FILE: true

targets:
  HozzCore:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzCore

  HozzAcquire:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzAcquire
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzAcquire

  HozzCatalog:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzCatalog
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzCatalog

  HozzStore:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzStore
    dependencies:
      - target: HozzCore
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzStore

  HozzUI:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzUI

  HozzDeliver:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzDeliver
    dependencies:
      - target: HozzCore
      - target: HozzStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzDeliver

  HozzHealth:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzHealth
    dependencies:
      - target: HozzCore
      - target: HozzAcquire
      - target: HozzCatalog
      - target: HozzStore
      - target: HozzDeliver
      - sdk: HealthKit.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzHealth

  HozzHealthFake:
    templates:
      - HozzFramework
    sources:
      - Sources/HozzHealthFake
    dependencies:
      - target: HozzCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzHealthFake

  Hozz:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App
    dependencies:
      - target: HozzCore
      - target: HozzAcquire
      - target: HozzCatalog
      - target: HozzStore
      - target: HozzDeliver
      - target: HozzHealth
      - target: HozzUI
      - target: HozzWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Hozz
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: App/Hozz.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.healthkit.access: []
        # Enabling the App Groups capability for this bundle id in the Apple
        # developer portal, then adding
        #   com.apple.security.application-groups: [group.com.thatcube.Hozz]
        # here and in the widget, is all the widget needs to show live state.
        # It is left out because the current development profile lacks the
        # capability and declaring it fails every device build.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hozz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Hozz reads the Health data you select so you can export it to destinations you own.
        BGTaskSchedulerPermittedIdentifiers:
          - com.thatcube.Hozz.processing
          - com.thatcube.Hozz.refresh
        UIBackgroundModes:
          - processing
          - fetch
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  HozzWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
    dependencies:
      - target: HozzCore
      - target: HozzStore
      - target: HozzDeliver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.Hozz.widget
        # The widget reads the same store the app writes, which requires the
        # shared container both sides already use.
        SKIP_INSTALL: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hozz
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  HozzTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: HozzCore
      - target: HozzAcquire
      - target: HozzCatalog
      - target: HozzStore
      - target: HozzDeliver
      - target: HozzHealth
      - target: HozzHealthFake
      - target: Hozz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatcube.HozzTests
        GENERATE_INFOPLIST_FILE: true
        # Keychain access needs an application identity, so the tests run
        # inside the app rather than as a standalone bundle.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hozz.app/Hozz"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Hozz:
    build:
      targets:
        Hozz: all
        HozzTests:
          - test
    test:
      targets:
        - HozzTests
